<!DOCTYPE html>
<html lang="sp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Recuerdos</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="JS/menu-cambiar-imagenes.js" defer></script>
</head>
<body id="cuerpo-2">
    <header>
        <h1><i class="bi bi-images"></i> Galería de Nuestras Experiencias <i class="bi bi-heart"></i></h1>
    </header>

    <main id="contenedor-menu">
        <div id="seccion-oc" class="caja-limitada">
            <h2></i>Nosotros</h2>
            <div id="pareja-icons">
                <div class="pareja-botones" id="magia-box">
                    <button class="btn-izquierda" type="button" aria-label="Ver imagen anterior"><i class="bi bi-caret-left-fill"></i></button>
                    <div class="pareja">
                        <div class="img-size-pareja">
                            <img src="MEDIA/match-youka.png" alt="Imagen 1 de 3">
                        </div>
                        <p>Youka [Yuki]</p>
                    </div>
                    <button class="btn-derecha" type="button" aria-label="Ver imagen siguiente"><i class="bi bi-caret-right-fill"></i></button>
                </div>
                
                <div class="pareja-botones" id="youka-box">
                    <button class="btn-izquierda" type="button" aria-label="Ver imagen anterior"><i class="bi bi-caret-left-fill"></i></button>
                    <div class="pareja">
                        <div class="img-size-pareja">
                            <img src="MEDIA/match-magia.png" alt="Imagen 1 de 3">
                        </div>
                        <p>Magia [Mayis]</p>
                    </div>
                    <button class="btn-derecha" type="button" aria-label="Ver imagen siguiente"><i class="bi bi-caret-right-fill"></i></button>
                </div>
            </div>
        </div>
    </main>

    <section id="menu-galeria">
        <h2><i class="bi bi-box2"></i> Áreas <i class="bi bi-box2"></i></h2>
    </section>

    <section id="categoria-roblox" class="caja-centrada">
        <div class="caja-limitada">
            <h2>Roblox</h2>
            <div class="galeria" id="galeria-roblox">
                <div class="botones-galeria">
                    <button id="boton-izquierdo-RB"><i class="bi bi-caret-left-fill"></i></button>
                </div>
                <div class="foto-enorme" id="foto-enorme-roblox">
                    <img src="MEDIA/roblox-moment/roblox-base.png" alt="">
                </div>
                <div class="botones-galeria">
                    <button id="boton-derecho-RB"><i class="bi bi-caret-right-fill"></i></button>
                </div>
            </div>
            <div class="caja-info" id="info-RB">
                <div id="fecha-RB">
                    <h2>21 - 02 - 2026</h2>
                </div>
                <div id="texto-RB">
                    <p>Angy wonita, estando justo en mi carita :3<br>Es lo mas cute q puedo ver d ella</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
