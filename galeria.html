<!DOCTYPE html>
<html lang="sp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Recuerdos</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="JS/menu-cambiar-imagenes.js" defer></script>
    <script src="JS/galeria-roblox.js" defer></script>
</head>
<body id="cuerpo-2">
    <header>
        <h1><i class="bi bi-images"></i> Galería de Nuestras Experiencias <i class="bi bi-heart"></i></h1>
    </header>

    <main id="contenedor-menu">
        <div id="seccion-oc" class="caja-limitada">
            <h2></i>Nosotros</h2>
            <div id="pareja-icons">
                <div class="pareja-botones" id="magia-box">
                    <button class="btn-izquierda" type="button" aria-label="Ver imagen anterior"><i class="bi bi-caret-left-fill"></i></button>
                    <div class="pareja">
                        <div class="img-size-pareja">
                            <img src="MEDIA/match-youka.png" alt="Imagen 1 de 3">
                        </div>
                        <p>Youka [Yuki]</p>
                    </div>
                    <button class="btn-derecha" type="button" aria-label="Ver imagen siguiente"><i class="bi bi-caret-right-fill"></i></button>
                </div>
                
                <div class="pareja-botones" id="youka-box">
                    <button class="btn-izquierda" type="button" aria-label="Ver imagen anterior"><i class="bi bi-caret-left-fill"></i></button>
                    <div class="pareja">
                        <div class="img-size-pareja">
                            <img src="MEDIA/match-magia.png" alt="Imagen 1 de 3">
                        </div>
                        <p>Magia [Mayis]</p>
                    </div>
                    <button class="btn-derecha" type="button" aria-label="Ver imagen siguiente"><i class="bi bi-caret-right-fill"></i></button>
                </div>
            </div>
        </div>
    </main>

    <section id="menu-galeria">
        <h2><i class="bi bi-box2"></i> Áreas <i class="bi bi-box2"></i></h2>
    </section>

    <section id="categoria-roblox" class="caja-centrada centrado">
        <h2>Roblox</h2>
        <div class="lotes-galeria">
            <div class="caja-limitada">
                <h2>Grow a Garden</h2>
                <div class="galeria" id="galeria-GAG">
                    <div class="botones-galeria">
                        <button id="boton-izquierdo-GAG" class="boton-izquierdo-RB"><i class="bi bi-caret-left-fill"></i></button>
                    </div>
                    <div class="foto-enorme" id="foto-enorme-GAG">
                        <img src="MEDIA/roblox-moment/GAG-1.png" alt="">
                    </div>
                    <div class="botones-galeria">
                        <button id="boton-derecho-GAG" class="boton-derecho-RB"><i class="bi bi-caret-right-fill"></i></button>
                    </div>
                </div>
                <div class="caja-info" id="info-RB">
                    <div id="fecha-GAG">
                        <h2>13 - 06 - 2026</h2>
                    </div>
                    <div id="texto-GAG">
                        <p>Chinchillaaaas, ijkdjaiosdj amoo</p>
                    </div>
                </div>
            </div>

            <div class="caja-limitada">
                <h2>Maple Hospital</h2>
                <div class="galeria" id="galeria-MH">
                    <div class="botones-galeria">
                        <button id="boton-izquierdo-MH" class="boton-izquierdo-RB"><i class="bi bi-caret-left-fill"></i></button>
                    </div>
                    <div class="foto-enorme" id="foto-enorme-MH">
                        <img src="MEDIA/roblox-moment/MH-1.png" alt="">
                    </div>
                    <div class="botones-galeria">
                        <button id="boton-derecho-MH" class="boton-derecho-RB"><i class="bi bi-caret-right-fill"></i></button>
                    </div>
                </div>
                <div class="caja-info" id="info-RB">
                    <div id="fecha-MH">
                        <h2>15 - 02 - 2026</h2>
                    </div>
                    <div id="texto-MH">
                        <p>Ahí fue cuando probé Maple Hospital por 2da vez<br>me gustó, y más cuando estuve junto con ella ;3</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
